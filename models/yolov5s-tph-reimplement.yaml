# YOLOv5 🚀 by Ultralytics, GPL-3.0 license
# TPH-YOLOv5 reimplementation (Fig. 3 of the paper) on YOLOv5s scale
# Comment format:  # <layer index>  <P level>  <shape out with v5s @640: channels x H x W>

# Parameters
nc: 80  # number of classes (overridden by data yaml, VisDrone = 10)
depth_multiple: 0.33  # model depth multiple
width_multiple: 0.50  # layer channel multiple
anchors: 3  # 3 anchors per head, computed by autoanchor at train start (4 heads -> 12 anchors)

# YOLOv5 v6.0 backbone
backbone:
  # [from, number, module, args]
  [[-1, 1, Conv, [64, 6, 2, 2]],    # 0   P1   32 x 320x320   (= Focus)
   [-1, 1, Conv, [128, 3, 2]],      # 1   P2   64 x 160x160
   [-1, 3, C3, [128]],              # 2   P2   64 x 160x160   <- head lấy P2 ở đây
   [-1, 1, Conv, [256, 3, 2]],      # 3   P3  128 x  80x80
   [-1, 6, C3, [256]],              # 4   P3  128 x  80x80    <- head lấy P3 ở đây
   [-1, 1, Conv, [512, 3, 2]],      # 5   P4  256 x  40x40
   [-1, 9, C3, [512]],              # 6   P4  256 x  40x40    <- head lấy P4 ở đây
   [-1, 1, Conv, [1024, 3, 2]],     # 7   P5  512 x  20x20
   [-1, 1, SPPF, [1024, 5]],        # 8   P5  512 x  20x20    (Fig.3: SPP)
   [-1, 3, C3TR, [1024]],           # 9   P5  512 x  20x20    (Fig.3: 3*Trans)
  ]

# TPH-YOLOv5 head
head:
  # ---------- ĐI LÊN: P5 -> P4 -> P3 -> P2 ---------- # tham chiếu ảnh 640*640
  [[-1, 1, Conv, [512, 1, 1]],                   # 10  P5  256 x  20x20   <- nhánh đi xuống nối lại (34)
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],   # 11  P4  256 x  40x40
   [[-1, 6], 1, Concat, [1]],                    # 12  P4  512 x  40x40   ghép backbone P4
   [-1, 3, C3, [512, False]],                    # 13  P4  256 x  40x40
   [-1, 1, CBAM, [512]],                         # 14  P4  256 x  40x40

   [-1, 1, Conv, [256, 1, 1]],                   # 15  P4  128 x  40x40   <- nhánh đi xuống nối lại (30)
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],   # 16  P3  128 x  80x80
   [[-1, 4], 1, Concat, [1]],                    # 17  P3  256 x  80x80   ghép backbone P3
   [-1, 3, C3, [256, False]],                    # 18  P3  128 x  80x80
   [-1, 1, CBAM, [256]],                         # 19  P3  128 x  80x80

   [-1, 1, Conv, [128, 1, 1]],                   # 20  P3   64 x  80x80   <- nhánh đi xuống nối lại (26)
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],   # 21  P2   64 x 160x160
   [[-1, 2], 1, Concat, [1]],                    # 22  P2  128 x 160x160  ghép backbone P2
   [-1, 1, C3TR, [128, False]],                  # 23  P2   64 x 160x160  ==> TPH 1 (vật tí hon)
   [-1, 1, CBAM, [128]],                         # 24  P2   64 x 160x160

  # ---------- ĐI XUỐNG: P2 -> P3 -> P4 -> P5 ----------
   [-1, 1, Conv, [128, 3, 2]],                   # 25  P3   64 x  80x80
   [[-1, 20], 1, Concat, [1]],                   # 26  P3  128 x  80x80   ghép layer 20
   [-1, 1, C3TR, [256, False]],                  # 27  P3  128 x  80x80   ==> TPH 2 (vật nhỏ)
   [-1, 1, CBAM, [256]],                         # 28  P3  128 x  80x80

   [-1, 1, Conv, [256, 3, 2]],                   # 29  P4  128 x  40x40
   [[-1, 15], 1, Concat, [1]],                   # 30  P4  256 x  40x40   ghép layer 15
   [-1, 2, C3TR, [512, False]],                  # 31  P4  256 x  40x40   ==> TPH 3 (vật vừa)
   [-1, 1, CBAM, [512]],                         # 32  P4  256 x  40x40

   [-1, 1, Conv, [512, 3, 2]],                   # 33  P5  256 x  20x20
   [[-1, 10], 1, Concat, [1]],                   # 34  P5  512 x  20x20   ghép layer 10
   [-1, 3, C3TR, [1024, False]],                 # 35  P5  512 x  20x20   ==> TPH 4 (vật lớn)

   [[23, 27, 31, 35], 1, Detect, [nc, anchors]], # 36  Detect(P2, P3, P4, P5)
  ]
